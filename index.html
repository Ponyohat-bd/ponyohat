<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonyoHat - পণ্যহাট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navbar -->
    <nav class="bg-teal-600 text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold">পণ্যহাট (PonyoHat)</h1>
            <div class="relative">
                <button onclick="toggleCart()" class="text-xl">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-1 rounded-full absolute -top-2 -right-2">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Banner -->
    <header class="bg-teal-100 py-12 text-center">
        <h2 class="text-3xl font-bold text-teal-800 mb-2">আপনার বিশ্বস্ত অনলাইন হাট</h2>
        <p class="text-gray-600">সেরা দামে মানসম্মত পণ্য কিনুন পণ্যহাট থেকে!</p>
    </header>

    <!-- Product Grid -->
    <main class="container mx-auto px-4 py-8">
        <h3 class="text-2xl font-bold text-gray-700 mb-6">আমাদের পণ্যসমূহ</h3>
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Product Item 1 -->
            <div class="bg-white rounded-lg shadow-md p-4 flex flex-col justify-between">
                <div>
                    <img src="https://via.placeholder.com/200" alt="পণ্য" class="w-full h-48 object-cover rounded-md mb-4">
                    <h4 class="font-bold text-lg mb-2">প্রিমিয়াম শাড়ি</h4>
                    <p class="text-teal-600 font-bold mb-4">৳ ২,৫০০</p>
                </div>
                <button onclick="addToCart('প্রিমিয়াম শাড়ি', 2500)" class="w-full bg-teal-600 text-white py-2 rounded-md hover:bg-teal-700">কার্টে যোগ করুন</button>
            </div>
            <!-- Product Item 2 -->
            <div class="bg-white rounded-lg shadow-md p-4 flex flex-col justify-between">
                <div>
                    <img src="https://via.placeholder.com/200" alt="পণ্য" class="w-full h-48 object-cover rounded-md mb-4">
                    <h4 class="font-bold text-lg mb-2">স্টাইলিশ পাঞ্জাবি</h4>
                    <p class="text-teal-600 font-bold mb-4">৳ ১,৮০০</p>
                </div>
                <button onclick="addToCart('স্টাইলিশ পাঞ্জাবি', 1800)" class="w-full bg-teal-600 text-white py-2 rounded-md hover:bg-teal-700">কার্টে যোগ করুন</button>
            </div>
        </div>
    </main>

    <!-- Shopping Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-end z-50">
        <div class="bg-white w-80 h-full p-4 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">শপিং কার্ট</h3>
                    <button onclick="toggleCart()" class="text-red-500 font-bold text-xl">&times;</button>
                </div>
                <div id="cart-items" class="space-y-2">
                    <p class="text-gray-500">কার্ট খালি আছে।</p>
                </div>
            </div>
            <div>
                <hr class="my-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>মোট:</span>
                    <span id="cart-total">৳ ০</span>
                </div>
                <button onclick="alert('অর্ডার সফল হয়েছে!')" class="w-full bg-green-600 text-white py-2 rounded-md font-bold">অর্ডার সম্পন্ন করুন</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            document.getElementById('cart-modal').classList.toggle('flex');
        }
        function addToCart(name, price) {
            cart.push({name, price});
            updateCart();
        }
        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartItems = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="text-gray-500">কার্ট খালি আছে।</p>';
                document.getElementById('cart-total').innerText = '৳ ০';
                return;
            }
            cartItems.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                cartItems.innerHTML += `<div class="flex justify-between"><span>${item.name}</span><span>৳ ${item.price}</span></div>`;
            });
            document.getElementById('cart-total').innerText = `৳ ${total}`;
        }
    </script>
</body>
</html>
